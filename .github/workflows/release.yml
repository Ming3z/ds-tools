name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release artifacts
        run: ./dev.sh build "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/release
      - name: Stage npm packages
        run: ./scripts/prepare-npm.sh --version "$GITHUB_REF_NAME"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/release/$GITHUB_REF_NAME"/*
          --title "$GITHUB_REF_NAME"
          --generate-notes
      - name: Publish npm packages
        run: |
          set -euo pipefail
          for package in \
            dist/npm/ds-tools-darwin-arm64 \
            dist/npm/ds-tools-darwin-x64 \
            dist/npm/ds-tools-linux-arm64 \
            dist/npm/ds-tools-linux-x64; do
            npm publish "$package" --access public --provenance
          done
          npm publish dist/npm/ds-tools --access public --provenance
